apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: campus-db-data
  namespace: unir
  labels:
    app.kubernetes.io/name: campus-db
    app.kubernetes.io/part-of: unir-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-db
  namespace: unir
  labels:
    app.kubernetes.io/name: campus-db
    app.kubernetes.io/part-of: unir-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: campus-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: campus-db
        app.kubernetes.io/part-of: unir-platform
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: unir_campus
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: unir-db-credentials
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: unir-db-credentials
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: campus-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: campus-db
  namespace: unir
  labels:
    app.kubernetes.io/name: campus-db
    app.kubernetes.io/part-of: unir-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: campus-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
