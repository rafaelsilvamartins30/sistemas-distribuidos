apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: engagement-read-db-data
  namespace: unir
  labels:
    app.kubernetes.io/name: engagement-read-db
    app.kubernetes.io/component: cqrs-read-model
    app.kubernetes.io/part-of: unir-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engagement-read-db
  namespace: unir
  labels:
    app.kubernetes.io/name: engagement-read-db
    app.kubernetes.io/component: cqrs-read-model
    app.kubernetes.io/part-of: unir-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: engagement-read-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engagement-read-db
        app.kubernetes.io/component: cqrs-read-model
        app.kubernetes.io/part-of: unir-platform
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: unir-mongodb-credentials
                  key: MONGODB_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: unir-mongodb-credentials
                  key: MONGODB_PASSWORD
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: unir-cqrs-mongodb-config
                  key: MONGODB_DATABASE
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - db.adminCommand('ping').ok
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - db.adminCommand('ping').ok
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: engagement-read-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: engagement-read-db
  namespace: unir
  labels:
    app.kubernetes.io/name: engagement-read-db
    app.kubernetes.io/component: cqrs-read-model
    app.kubernetes.io/part-of: unir-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: engagement-read-db
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
