            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: unir-common-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: unir-rabbitmq-credentials
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: unir-rabbitmq-credentials
                  key: RABBITMQ_PASSWORD
          readinessProbe:
