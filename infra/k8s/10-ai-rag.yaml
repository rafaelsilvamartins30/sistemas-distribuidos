apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-rag-model-cache
  namespace: unir
  labels:
    app.kubernetes.io/name: ai-rag
    app.kubernetes.io/part-of: unir-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-rag-data
  namespace: unir
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: unir-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: unir
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: unir-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/part-of: unir-platform
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6333
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: qdrant-rag-data
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: unir
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: unir-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-rag
  namespace: unir
  labels:
    app.kubernetes.io/name: ai-rag
    app.kubernetes.io/part-of: unir-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-rag
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-rag
        app.kubernetes.io/part-of: unir-platform
    spec:
      containers:
        - name: ai-rag
          image: unir-ai-rag:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8090
              name: http
          envFrom:
            - configMapRef:
                name: unir-common-config
          env:
            - name: FASTEMBED_CACHE_PATH
              value: /var/cache/fastembed
            - name: RAG_SYNC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: unir-rag-credentials
                  key: RAG_SYNC_TOKEN
            - name: RAG_SYNC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: unir-rag-credentials
                  key: RAG_SYNC_CLIENT_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: unir-rag-credentials
                  key: GEMINI_API_KEY
          volumeMounts:
            - name: model-cache
              mountPath: /var/cache/fastembed
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: ai-rag-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: ai-rag
  namespace: unir
  labels:
    app.kubernetes.io/name: ai-rag
    app.kubernetes.io/part-of: unir-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-rag
  ports:
    - name: http
      port: 8090
      targetPort: 8090
