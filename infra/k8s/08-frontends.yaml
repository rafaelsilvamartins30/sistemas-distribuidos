apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: unir
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: unir-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: unir-platform
    spec:
      containers:
        - name: web
          image: unir-web:local
          imagePullPolicy: Never
          ports:
            - containerPort: 5173
              name: http
          env:
            - name: VITE_KEYCLOAK_URL
              valueFrom:
                configMapKeyRef:
                  name: unir-common-config
                  key: VITE_KEYCLOAK_URL
            - name: VITE_KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: unir-common-config
                  key: VITE_KEYCLOAK_REALM
            - name: VITE_KEYCLOAK_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: unir-common-config
                  key: VITE_KEYCLOAK_CLIENT_ID
            - name: KEYCLOAK_INTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  name: unir-common-config
                  key: KEYCLOAK_INTERNAL_URL
            - name: VITE_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: unir-common-config
                  key: VITE_GATEWAY_URL
          readinessProbe:
            tcpSocket:
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: unir
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: unir-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 5173
      targetPort: 5173
---
