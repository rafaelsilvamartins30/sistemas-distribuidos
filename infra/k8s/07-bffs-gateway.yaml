apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-bff
  namespace: unir
  labels:
    app.kubernetes.io/name: web-bff
    app.kubernetes.io/part-of: unir-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-bff
        app.kubernetes.io/part-of: unir-platform
    spec:
      containers:
        - name: web-bff
          image: unir-web-bff:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: CAMPUS_URL
              valueFrom:
                configMapKeyRef:
                  name: unir-common-config
                  key: CAMPUS_URL
            - name: ENGAGEMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: unir-common-config
                  key: ENGAGEMENT_SERVICE_URL
            - name: ACCESS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: unir-common-config
                  key: ACCESS_SERVICE_URL
            - name: RAG_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: unir-common-config
                  key: RAG_SERVICE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web-bff
  namespace: unir
  labels:
    app.kubernetes.io/name: web-bff
    app.kubernetes.io/part-of: unir-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web-bff
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
