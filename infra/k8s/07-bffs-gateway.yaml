apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: unir
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: unir-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: unir-platform
    spec:
      containers:
        - name: gateway
          image: unir-gateway:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Dhttp.keepAlive=false -Djdk.httpclient.keepalive.timeout=0"
            - name: WEB_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: unir-common-config
                  key: WEB_ORIGIN
            - name: ADMIN_WEB_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: unir-common-config
                  key: ADMIN_WEB_ORIGIN
            - name: WEB_BFF_URL
              valueFrom:
                configMapKeyRef:
                  name: unir-common-config
                  key: WEB_BFF_URL
            - name: ADMIN_BFF_URL
              valueFrom:
                configMapKeyRef:
                  name: unir-common-config
                  key: ADMIN_BFF_URL
            - name: KEYCLOAK_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: unir-common-config
                  key: KEYCLOAK_ISSUER_URI
            - name: KEYCLOAK_JWK_SET_URI
              valueFrom:
                configMapKeyRef:
                  name: unir-common-config
                  key: KEYCLOAK_JWK_SET_URI
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: unir
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: unir-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
