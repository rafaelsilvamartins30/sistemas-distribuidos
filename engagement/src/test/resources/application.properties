spring.datasource.url=jdbc:h2:mem:engagement;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.target=4
spring.flyway.locations=classpath:db/migration,classpath:db/test-migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:18081/realms/unir
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:18081/realms/unir/protocol/openid-connect/certs
engagement.outbox.poll-interval-ms=3600000
engagement.outbox.enabled=false
engagement.registration-expiry.poll-interval-ms=3600000
spring.rabbitmq.listener.simple.auto-startup=false
