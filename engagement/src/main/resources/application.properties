spring.application.name=engagement
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15434/unir_engagement}
spring.datasource.username=${DB_USERNAME:unir}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:18081/realms/unir}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:18081/realms/unir/protocol/openid-connect/certs}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
campus.url=${CAMPUS_URL:http://localhost:3000}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
engagement.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:1000}
engagement.registration-expiry.poll-interval-ms=${REGISTRATION_EXPIRY_POLL_INTERVAL_MS:60000}
