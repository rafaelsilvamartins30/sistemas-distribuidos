spring.application.name=user-service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15433/unir_users}
spring.datasource.username=${DB_USERNAME:unir}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:18081/realms/unir}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:18081/realms/unir/protocol/openid-connect/certs}
