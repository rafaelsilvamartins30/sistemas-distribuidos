[project]
name = "unir-ai-rag"
version = "0.1.0"
description = "UNIR AI/RAG service for discovering campus events and academic opportunities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.2",
    "pydantic>=2.9.0",
    "langchain-core>=1.0.0",
    "langchain-google-genai>=3.0.0",
    "qdrant-client>=1.12.1",
    "fastembed>=0.4.2",
    "PyJWT[crypto]>=2.10.1,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15.0",
    "pytest>=9.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unir_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
