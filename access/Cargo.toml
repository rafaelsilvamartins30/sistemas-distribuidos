[package]
name = "access"
version = "0.1.0"
edition = "2021"

[dependencies]
futures-util = "=0.3.34"
jsonwebtoken = { version = "=10.3.0", features = ["aws_lc_rs"] }
lapin = "=4.10.0"
qrcodegen = "=1.8.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.8"
sqlx = { version = "=0.9.1", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-ring-webpki", "uuid"] }
time = { version = "=0.3.55", features = ["serde-human-readable"] }
tokio = { version = "=1.51.6", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
uuid = { version = "=1.12.1", features = ["serde", "v4"] }
