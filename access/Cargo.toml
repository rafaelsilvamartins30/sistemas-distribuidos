[package]
name = "access"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "=0.4.39", features = ["serde"] }
futures-util = "=0.3.31"
jsonwebtoken = "=9.3.1"
lapin = "=2.5.3"
qrcodegen = "=1.8.0"
reqwest = { version = "=0.12.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
sha2 = "=0.10.8"
sqlx = { version = "=0.8.6", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
tokio = { version = "=1.43.0", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-executor-trait = "=2.1.2"
tokio-reactor-trait = "=1.1.0"
uuid = { version = "=1.12.1", features = ["serde", "v4"] }
