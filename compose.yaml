name: unir

services:
  campus-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unir_campus
      POSTGRES_USER: unir
      POSTGRES_PASSWORD: ${DB_PASSWORD:-unir-local-only}
    volumes:
      - campus_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unir -d unir_campus"]
      interval: 5s
      timeout: 5s
      retries: 15

  engagement-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unir_engagement
      POSTGRES_USER: unir
      POSTGRES_PASSWORD: ${DB_PASSWORD:-unir-local-only}
    ports:
      - "127.0.0.1:${ENGAGEMENT_DB_PORT:-15434}:5432"
    volumes:
      - engagement_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unir -d unir_engagement"]
      interval: 5s
      timeout: 5s
      retries: 15

  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unir_payment
      POSTGRES_USER: unir
      POSTGRES_PASSWORD: ${DB_PASSWORD:-unir-local-only}
    ports:
      - "127.0.0.1:${PAYMENT_DB_PORT:-15435}:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unir -d unir_payment"]
      interval: 5s
      timeout: 5s
      retries: 15

  access-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unir_access
      POSTGRES_USER: unir
      POSTGRES_PASSWORD: ${DB_PASSWORD:-unir-local-only}
    ports:
      - "127.0.0.1:${ACCESS_DB_PORT:-15436}:5432"
    volumes:
      - access_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unir -d unir_access"]
      interval: 5s
      timeout: 5s
      retries: 15

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local-only}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 15

  engagement-read-db:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-unir}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-unir-local-only}
    volumes:
      - mongodb_data:/data/db
    networks:
      - data
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-unir}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-unir-local-only}
    ports:
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - data
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.29.5
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-18025}:8025"
    networks:
      - data

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "127.0.0.1:${QDRANT_PORT:-16333}:6333"
    volumes:
      - qdrant_rag_data:/qdrant/storage
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && read -r r <&3 && [[ \"$$r\" == *\"200\"* ]]'"]
      interval: 5s
      timeout: 5s
      retries: 15

  keycloak:
    build:
      context: ./keycloak-theme
    image: unir-keycloak:local
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-local-only}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-18081}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local-only}
      KC_HEALTH_ENABLED: "true"
      KC_SPI_REQUIRED_ACTION__UPDATE_PASSWORD__MAX_AUTH_AGE: "0"
      KC_SPI_REQUIRED_ACTION__UPDATE_EMAIL__MAX_AUTH_AGE: "0"
      KC_SPI_REQUIRED_ACTION__UPDATE_EMAIL__VERIFY_EMAIL: "true"
      KC_SPI_REQUIRED_ACTION__CONFIGURE_TOTP__ADD_RECOVERY_CODES: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-18081}:8080"
    volumes:
      - ./config/keycloak/unir-realm.json:/opt/keycloak/data/import/unir-realm.json:ro
    networks:
      - edge
      - internal
      - data
    depends_on:
      keycloak-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3 &&
          read -r response <&3 && [[ "$$response" == *"200"* ]]'
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 15s

  keycloak-profile-config:
    image: unir-keycloak:local
    entrypoint: ["/bin/sh", "/config/apply-user-profile.sh"]
    environment:
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-local-only}
      WEB_PORT: ${WEB_PORT:-15173}
      ADMIN_WEB_PORT: ${ADMIN_WEB_PORT:-15175}
      RECOVERY_CODES_ENABLED: "true"
    volumes:
      - ./config/keycloak/user-profile.json:/config/user-profile.json:ro
      - ./config/keycloak/apply-user-profile.sh:/config/apply-user-profile.sh:ro
    networks:
      - internal
    depends_on:
      keycloak:
        condition: service_healthy

  campus:
    build:
      context: ./campus
    image: unir-campus:local
    command: ["sh", "-c", "bin/rails db:migrate && bin/rails server -b 0.0.0.0"]
    environment:
      RAILS_ENV: development
      DB_HOST: campus-db
      DB_NAME: unir_campus
      DB_USERNAME: unir
      DB_PASSWORD: ${DB_PASSWORD:-unir-local-only}
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-18081}/realms/unir
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/unir/protocol/openid-connect/certs
      PORT: 3000
    networks:
      - internal
      - data
    depends_on:
      campus-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - ruby
        - -rnet/http
        - -e
        - "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/health/ready')).is_a?(Net::HTTPSuccess) ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  engagement:
    build:
      context: ./engagement
    image: unir-engagement:local
    environment:
      DB_URL: jdbc:postgresql://engagement-db:5432/unir_engagement
      DB_USERNAME: unir
      DB_PASSWORD: ${DB_PASSWORD:-unir-local-only}
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-18081}/realms/unir
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/unir/protocol/openid-connect/certs
      CAMPUS_URL: http://campus:3000
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-unir}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-unir-local-only}
      MONGODB_HOST: engagement-read-db
      MONGODB_PORT: "27017"
      MONGODB_DATABASE: unir_engagement_read
      MONGODB_USERNAME: ${MONGODB_USERNAME:-unir}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-unir-local-only}
      MONGODB_URI: mongodb://${MONGODB_USERNAME:-unir}:${MONGODB_PASSWORD:-unir-local-only}@engagement-read-db:27017/unir_engagement_read?authSource=admin
    ports:
      - "127.0.0.1:${ENGAGEMENT_PORT:-18085}:8080"
    networks:
      - internal
      - data
    depends_on:
      engagement-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      engagement-read-db:
        condition: service_healthy
      campus:
        condition: service_healthy

  payment:
    build:
      context: ./payment
    image: unir-payment:local
    environment:
      PORT: 8080
      PAYMENT_ENV: local
      PAYMENT_SIMULATED_CONFIRMATION_ENABLED: "true"
      DB_URL: postgres://unir:${DB_PASSWORD:-unir-local-only}@payment-db:5432/unir_payment?sslmode=disable
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-18081}/realms/unir
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/unir/protocol/openid-connect/certs
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-unir}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-unir-local-only}
    ports:
      - "127.0.0.1:${PAYMENT_PORT:-18086}:8080"
    networks:
      - internal
      - data
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  access:
    build:
      context: ./access
    image: unir-access:local
    environment:
      PORT: 8080
      DB_URL: postgres://unir:${DB_PASSWORD:-unir-local-only}@access-db:5432/unir_access
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-18081}/realms/unir
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/unir/protocol/openid-connect/certs
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-unir}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-unir-local-only}
    ports:
      - "127.0.0.1:${ACCESS_PORT:-18087}:8080"
    networks:
      - internal
      - data
    depends_on:
      access-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  ai-rag:
    build:
      context: ./ai-rag
    image: unir-ai-rag:local
    environment:
      ENGAGEMENT_URL: http://engagement:8080
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-unir_knowledge}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      FASTEMBED_CACHE_PATH: /var/cache/fastembed
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-18081}/realms/unir
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/unir/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/unir/protocol/openid-connect/token
      RAG_USER_CLIENT_IDS: unir-web
      RAG_SYNC_TOKEN: ${RAG_SYNC_TOKEN:-unir-rag-sync-local-only}
      RAG_SYNC_CLIENT_ID: ${RAG_SYNC_CLIENT_ID:-unir-rag-sync}
      RAG_SYNC_CLIENT_SECRET: ${RAG_SYNC_CLIENT_SECRET:-unir-rag-client-local-only}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "127.0.0.1:${AI_RAG_PORT:-18090}:8090"
    volumes:
      - ai_rag_model_cache:/var/cache/fastembed
    networks:
      - internal
      - data
    depends_on:
      qdrant:
        condition: service_started
      engagement:
        condition: service_started
      keycloak:
        condition: service_healthy

  web-bff:
    build:
      context: ./web-bff
    image: unir-web-bff:local
    environment:
      PORT: 3000
      CAMPUS_URL: http://campus:3000
      ENGAGEMENT_SERVICE_URL: http://engagement:8080
      ACCESS_SERVICE_URL: http://access:8080
      PAYMENT_SERVICE_URL: http://payment:8080
      RAG_SERVICE_URL: http://ai-rag:8090
    ports:
      - "127.0.0.1:${WEB_BFF_PORT:-18083}:3000"
    networks:
      - internal
    depends_on:
      campus:
        condition: service_healthy
      engagement:
        condition: service_started
      access:
        condition: service_started
      payment:
        condition: service_started
      ai-rag:
        condition: service_started

  admin-bff:
    build:
      context: ./admin-bff
    image: unir-admin-bff:local
    environment:
      PORT: 3000
      CAMPUS_URL: http://campus:3000
      ENGAGEMENT_SERVICE_URL: http://engagement:8080
    networks:
      - internal
    depends_on:
      campus:
        condition: service_healthy
      engagement:
        condition: service_started

  gateway:
    build:
      context: ./gateway
    image: unir-gateway:local
    environment:
      WEB_ORIGIN: http://localhost:${WEB_PORT:-15173}
      ADMIN_WEB_ORIGIN: http://localhost:${ADMIN_WEB_PORT:-15175}
      WEB_BFF_URL: http://web-bff:3000
      ADMIN_BFF_URL: http://admin-bff:3000
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-18081}/realms/unir
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/unir/protocol/openid-connect/certs
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-18084}:8080"
    networks:
      - edge
      - internal
    depends_on:
      keycloak:
        condition: service_healthy
      web-bff:
        condition: service_started
      admin-bff:
        condition: service_started

  web:
    build:
      context: ./web
    image: unir-web:local
    environment:
      VITE_KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:-18081}
      VITE_KEYCLOAK_REALM: unir
      VITE_KEYCLOAK_CLIENT_ID: unir-web
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      VITE_GATEWAY_URL: http://localhost:${GATEWAY_PORT:-18084}
    ports:
      - "127.0.0.1:${WEB_PORT:-15173}:5173"
    networks:
      - edge
    depends_on:
      gateway:
        condition: service_started
      keycloak:
        condition: service_healthy
      keycloak-profile-config:
        condition: service_completed_successfully

  admin-web:
    build:
      context: ./admin-web
    image: unir-admin-web:local
    environment:
      VITE_KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:-18081}
      VITE_KEYCLOAK_REALM: unir
      VITE_KEYCLOAK_CLIENT_ID: unir-web
      VITE_GATEWAY_URL: http://localhost:${GATEWAY_PORT:-18084}
    ports:
      - "127.0.0.1:${ADMIN_WEB_PORT:-15175}:5173"
    networks:
      - edge
    depends_on:
      gateway:
        condition: service_started
      keycloak:
        condition: service_healthy
      keycloak-profile-config:
        condition: service_completed_successfully

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
  data:
    driver: bridge

volumes:
  campus_data:
  engagement_data:
  payment_data:
  access_data:
  keycloak_db_data:
  rabbitmq_data:
  mongodb_data:
  qdrant_rag_data:
  ai_rag_model_cache:
