name: unir

services:
  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unir_users
      POSTGRES_USER: unir
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${USER_DB_PORT:-15433}:5432"
    volumes:
      - user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unir -d unir_users"]
      interval: 5s
      timeout: 5s
      retries: 10

  engagement-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unir_engagement
      POSTGRES_USER: unir
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ENGAGEMENT_DB_PORT:-15434}:5432"
    volumes:
      - engagement_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unir -d unir_engagement"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unir_payment
      POSTGRES_USER: unir
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PAYMENT_DB_PORT:-15435}:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unir -d unir_payment"]
      interval: 5s
      timeout: 5s
      retries: 10

  access-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unir_access
      POSTGRES_USER: unir
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ACCESS_DB_PORT:-15436}:5432"
    volumes:
      - access_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unir -d unir_access"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.29.5
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-18025}:8025"

  keycloak:
    build:
      context: ./keycloak-theme
    image: unir-keycloak:local
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-18081}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_SPI_REQUIRED_ACTION__UPDATE_PASSWORD__MAX_AUTH_AGE: "0"
      KC_SPI_REQUIRED_ACTION__UPDATE_EMAIL__MAX_AUTH_AGE: "0"
      KC_SPI_REQUIRED_ACTION__UPDATE_EMAIL__VERIFY_EMAIL: "true"
      KC_SPI_REQUIRED_ACTION__CONFIGURE_TOTP__ADD_RECOVERY_CODES: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-18081}:8080"
    volumes:
      - ./config/keycloak/unir-realm.json:/opt/keycloak/data/import/unir-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3 &&
          read -r response <&3 && [[ "$$response" == *"200"* ]]'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  user-service:
    build:
      context: ./user-service
    image: unir-user-service:local
    environment:
      DB_URL: jdbc:postgresql://user-db:5432/unir_users
      DB_USERNAME: unir
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-15173}
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-18081}/realms/unir
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/unir/protocol/openid-connect/certs
    ports:
      - "127.0.0.1:${USER_SERVICE_PORT:-18082}:8080"
    depends_on:
      user-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  engagement:
    build:
      context: ./engagement
    image: unir-engagement:local
    environment:
      DB_URL: jdbc:postgresql://engagement-db:5432/unir_engagement
      DB_USERNAME: unir
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-18081}/realms/unir
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/unir/protocol/openid-connect/certs
    ports:
      - "127.0.0.1:${ENGAGEMENT_PORT:-18085}:8080"
    depends_on:
      engagement-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  payment:
    build:
      context: ./payment
    image: unir-payment:local
    environment:
      PORT: 8080
      DB_URL: postgres://unir:${DB_PASSWORD:?Set DB_PASSWORD in .env}@payment-db:5432/unir_payment?sslmode=disable
    ports:
      - "127.0.0.1:${PAYMENT_PORT:-18086}:8080"
    depends_on:
      payment-db:
        condition: service_healthy

  access:
    build:
      context: ./access
    image: unir-access:local
    environment:
      PORT: 8080
      DB_URL: postgres://unir:${DB_PASSWORD:?Set DB_PASSWORD in .env}@access-db:5432/unir_access
    ports:
      - "127.0.0.1:${ACCESS_PORT:-18087}:8080"
    depends_on:
      access-db:
        condition: service_healthy

  web-bff:
    build:
      context: ./web-bff
    image: unir-web-bff:local
    environment:
      PORT: 3000
      USER_SERVICE_URL: http://user-service:8080
    ports:
      - "127.0.0.1:${WEB_BFF_PORT:-18083}:3000"
    depends_on:
      user-service:
        condition: service_started

  admin-bff:
    build:
      context: ./admin-bff
    image: unir-admin-bff:local
    environment:
      PORT: 3000
      USER_SERVICE_URL: http://user-service:8080
    ports:
      - "127.0.0.1:${ADMIN_BFF_PORT:-18088}:3000"
    depends_on:
      user-service:
        condition: service_started

  gateway:
    build:
      context: ./gateway
    image: unir-gateway:local
    environment:
      WEB_ORIGIN: http://localhost:${WEB_PORT:-15173}
      WEB_BFF_URL: http://web-bff:3000
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-18081}/realms/unir
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/unir/protocol/openid-connect/certs
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-18084}:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      web-bff:
        condition: service_started

  keycloak-profile-config:
    image: unir-keycloak:local
    entrypoint: ["/bin/sh", "/config/apply-user-profile.sh"]
    environment:
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      WEB_PORT: ${WEB_PORT:-15173}
      RECOVERY_CODES_ENABLED: "true"
    volumes:
      - ./config/keycloak/user-profile.json:/config/user-profile.json:ro
      - ./config/keycloak/apply-user-profile.sh:/config/apply-user-profile.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy

  web:
    build:
      context: ./web
    image: unir-web:local
    environment:
      VITE_KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:-18081}
      VITE_KEYCLOAK_REALM: unir
      VITE_KEYCLOAK_CLIENT_ID: unir-web
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      VITE_GATEWAY_URL: http://localhost:${GATEWAY_PORT:-18084}
    ports:
      - "127.0.0.1:${WEB_PORT:-15173}:5173"
    depends_on:
      gateway:
        condition: service_started
      keycloak:
        condition: service_healthy
      keycloak-profile-config:
        condition: service_completed_successfully

  admin-web:
    build:
      context: ./admin-web
    image: unir-admin-web:local
    environment:
      VITE_KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:-18081}
      VITE_KEYCLOAK_REALM: unir
      VITE_KEYCLOAK_CLIENT_ID: unir-web
      VITE_ADMIN_BFF_URL: http://localhost:${ADMIN_BFF_PORT:-18088}
    ports:
      - "127.0.0.1:${ADMIN_WEB_PORT:-15175}:5173"
    depends_on:
      admin-bff:
        condition: service_started
      keycloak:
        condition: service_healthy
      keycloak-profile-config:
        condition: service_completed_successfully

volumes:
  user_data:
  engagement_data:
  payment_data:
  access_data:
  keycloak_db_data:
